[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "agentic-maintenance-workflow"
version = "0.1.0"
description = "Simulated maintenance anomaly and human approval workflow"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "pydantic>=2.8",
  "pydantic-settings>=2.4",
  "sqlalchemy[asyncio]>=2.0",
  "asyncpg>=0.29",
  "alembic>=1.13",
  "sse-starlette>=2.1",
  "httpx>=0.27",
  "langgraph>=1.0",
  "langgraph-checkpoint-postgres>=2.0",
  "groq>=0.11",
  "numpy>=2.0",
  "scipy>=1.14",
  "scikit-learn>=1.5",
  "pandas>=2.2",
  "fastembed>=0.4",
  "pgvector>=0.3",
  "joblib>=1.4",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.24", "ruff>=0.6"]

[tool.setuptools.packages.find]
where = ["."]

[tool.pytest.ini_options]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]