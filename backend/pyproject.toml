[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "agentic-maintenance-workflow"
version = "0.1.0"
description = "Simulated maintenance anomaly and human approval workflow"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.8",
  "pydantic-settings>=2.4",
  "sqlalchemy[asyncio]>=2.0",
  "asyncpg>=0.29",
  "alembic>=1.13",
  "sse-starlette>=2.1",
  "httpx>=0.27",
  "langgraph>=1.0",
  "langgraph-checkpoint-postgres>=2.0",
  "groq>=0.11",
  "numpy>=2.0",
  "scipy>=1.14",
  "scikit-learn>=1.5",
  "pandas>=2.2",
  "fastembed>=0.4",
  "pgvector>=0.3",
  "joblib>=1.4",
  "PyYAML>=6.0",
  "pyarrow>=19,<22",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-asyncio>=0.24",
  "pytest-cov>=5.0",
  "ruff>=0.6",
  "mypy>=1.11",
  "pip-audit>=2.7",
  "pre-commit>=3.7",
]

[tool.setuptools.packages.find]
where = ["."]

[tool.pytest.ini_options]
pythonpath = ["."]

[tool.coverage.run]
source = ["app"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
warn_unused_configs = true

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
