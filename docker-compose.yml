services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: maintenance
      POSTGRES_USER: maintenance
      POSTGRES_PASSWORD: maintenance
    ports:
      - "5432:5432"
    volumes:
      - maintenance_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U maintenance -d maintenance"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      DATABASE_URL: postgresql+asyncpg://maintenance:maintenance@db:5432/maintenance
      LLM_MODE: ${LLM_MODE:-fake}
      PIPELINE_MODE: ${PIPELINE_MODE:-live}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    image: node:20-alpine
    working_dir: /workspace/frontend
    volumes:
      - .:/workspace
      - /workspace/frontend/node_modules
    environment:
      VITE_API_BASE_URL: http://localhost:8000/api/v1
      VITE_PIPELINE_MODE: ${PIPELINE_MODE:-live}
    ports:
      - "5173:5173"
    command: sh -c "npm install --package-lock-only && npm ci && npm run dev -- --host 0.0.0.0"

volumes:
  maintenance_pgdata: