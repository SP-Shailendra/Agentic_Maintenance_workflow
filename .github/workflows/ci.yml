name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.23"
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - run: uv sync --locked --extra dev --project backend
      - run: uv run --locked --project backend pre-commit run --all-files
      - run: uv run --locked --project backend ruff check backend/app backend/tests backend/scripts backend/alembic
      - run: uv run --locked mypy app
        working-directory: backend
      - run: uv run --locked pytest tests --cov=app --cov-report=term-missing --cov-report=xml:coverage.xml
        working-directory: backend
      - run: uv run --locked python -m scripts.baseline_report
        working-directory: backend
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-coverage
          path: backend/coverage.xml
          if-no-files-found: warn
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: detection-baseline
          path: docs/BASELINE.md
          if-no-files-found: warn
      - run: uv run --locked --project backend pip-audit --skip-editable
      - run: docker build -f backend/Dockerfile -t agentic-maintenance-workflow:ci .
      - uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: agentic-maintenance-workflow:ci
          format: table
          vuln-type: os,library
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm ci
      - run: npm audit --omit=dev --audit-level=high
      - run: npm run build
